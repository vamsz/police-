# Production-shaped stack: the app plus its own Postgres, wired together on a
# private network. Copy .env.docker.example to .env and fill it in, then:
#
#   docker compose up -d --build
#
# The app waits for the database to be healthy, runs migrations, then serves on
# http://localhost:4000. Put a TLS-terminating reverse proxy in front for
# production — browsers require HTTPS for the Geolocation API.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rally}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-police_rally}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-rally} -d ${POSTGRES_DB:-police_rally}']
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host: only the app reaches it, over the private network.
    expose:
      - '5432'
    networks:
      - rally

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgres://${POSTGRES_USER:-rally}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-police_rally}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_REGISTRATION_CODE: ${ADMIN_REGISTRATION_CODE:?set ADMIN_REGISTRATION_CODE in .env}
      OFFICER_REGISTRATION_CODE: ${OFFICER_REGISTRATION_CODE:?set OFFICER_REGISTRATION_CODE in .env}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MAP_DEFAULT_LAT: ${MAP_DEFAULT_LAT:-12.9716}
      MAP_DEFAULT_LNG: ${MAP_DEFAULT_LNG:-77.5946}
    # Migrate to the latest schema, then start. Migrations are idempotent, so a
    # restart or a second replica is safe.
    command: sh -c "npm run migrate && node src/server.js"
    ports:
      - '${APP_PORT:-4000}:4000'
    networks:
      - rally

volumes:
  pgdata:

networks:
  rally:
    driver: bridge
