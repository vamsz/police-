<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Deployment console · Rally Deployment Tracker</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="app">
<div class="app-map"><div id="map"></div></div>

<button type="button" id="signOut" class="corner-signout">Sign out</button>

<div class="corner-name">
  <span class="corner-name__title" id="adminName">Supervisor</span>
  <span class="corner-name__meta" id="refreshedAt"></span>
</div>

<aside class="float-panel">
  <!-- Roster mode -->
  <div id="rosterMode" class="panel-body">
    <div class="summary" id="summary"></div>

    <div class="panel-search">
      <label class="sr-only" for="search">Search officers</label>
      <input type="search" id="search" placeholder="Search by name, badge, or rally…" autocomplete="off">
    </div>

    <h2 class="section-title">
      <span>Officers</span>
      <span id="rosterCount"></span>
    </h2>
    <div id="roster"></div>

    <h2 class="section-title">
      <span>Open alerts</span>
      <span id="alertCount"></span>
    </h2>
    <div id="alerts"></div>
  </div>

  <!-- Detail mode: replaces the roster so the map is never covered -->
  <div id="detailMode" class="panel-body" hidden></div>
</aside>

<script type="module" src="/js/pages/admin.js"></script>
</body>
</html>
