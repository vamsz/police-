<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Deployment console · Rally Deployment Tracker</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="app">
<div id="map" class="app-map"></div>

<header class="float-top">
  <div class="brand">
    <div class="brand__logo" aria-hidden="true">RD</div>
    <div>
      <div class="brand__title">Deployment console</div>
      <div class="brand__sub" id="adminName">Supervisor</div>
    </div>
  </div>
  <div class="float-top__spacer"></div>
  <span class="float-top__meta" id="refreshedAt"></span>
  <button type="button" id="signOut" class="btn-ghost">Sign out</button>
</header>

<aside class="float-panel">
  <!-- Roster mode -->
  <div id="rosterMode" class="panel-body">
    <div class="summary" id="summary"></div>

    <div class="panel-search">
      <label class="sr-only" for="search">Search officers</label>
      <input type="search" id="search" placeholder="Search by name, badge, or rally…" autocomplete="off">
    </div>

    <h2 class="section-title">
      <span>Officers</span>
      <span id="rosterCount"></span>
    </h2>
    <div id="roster"></div>

    <h2 class="section-title">
      <span>Open alerts</span>
      <span id="alertCount"></span>
    </h2>
    <div id="alerts"></div>
  </div>

  <!-- Detail mode: replaces the roster so the map is never covered -->
  <div id="detailMode" class="panel-body" hidden></div>
</aside>

<script type="module" src="/js/pages/admin.js"></script>
</body>
</html>
