<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Sign in · Rally Deployment Tracker</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<main class="auth">
  <div class="auth__card">
    <div class="auth__logo" aria-hidden="true">RD</div>
    <div class="auth__brand">
      <h1>Rally Deployment Tracker</h1>
      <p>Officer deployment and position monitoring</p>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabSignIn" aria-selected="true" aria-controls="signInForm">Sign in</button>
      <button type="button" role="tab" id="tabRegister" aria-selected="false" aria-controls="registerForm">Register</button>
    </div>

    <div id="message" class="message" hidden></div>

    <form id="signInForm" novalidate>
      <div class="field">
        <label for="signInPhone">Phone number</label>
        <input type="tel" id="signInPhone" name="phone" autocomplete="username" inputmode="tel"
               placeholder="+919876543210" required>
      </div>
      <div class="field">
        <label for="signInPassword">Password</label>
        <input type="password" id="signInPassword" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn--primary btn--block">Sign in</button>
    </form>

    <form id="registerForm" novalidate hidden>
      <div class="field">
        <label for="registerName">Full name</label>
        <input type="text" id="registerName" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="registerPhone">Phone number</label>
        <input type="tel" id="registerPhone" name="phone" autocomplete="username" inputmode="tel"
               placeholder="+919876543210" required>
        <p class="field__hint">This is your sign-in ID.</p>
      </div>
      <div class="field">
        <label for="registerEmail">Email <span style="font-weight:400">(optional)</span></label>
        <input type="email" id="registerEmail" name="email" autocomplete="email">
      </div>
      <div class="field">
        <label for="registerBadge">Badge / ID number <span style="font-weight:400">(optional)</span></label>
        <input type="text" id="registerBadge" name="badgeId">
      </div>
      <div class="field">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" name="password" autocomplete="new-password"
               minlength="8" required>
        <p class="field__hint">At least 8 characters.</p>
      </div>
      <div class="field">
        <label for="registerCode">Access code</label>
        <input type="password" id="registerCode" name="accessCode" autocomplete="off" required>
        <p class="field__hint">Issued by your administrator. It decides whether this account is an officer or a supervisor.</p>
      </div>
      <button type="submit" class="btn btn--primary btn--block">Create account</button>
    </form>
  </div>
</main>

<script type="module" src="/js/pages/login.js"></script>
</body>
</html>
