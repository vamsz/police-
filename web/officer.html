<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>My post · Rally Deployment Tracker</title>
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="app">
<div class="app-map"><div id="map"></div></div>

<button type="button" id="signOut" class="corner-signout">Sign out</button>

<div class="corner-name">
  <span class="corner-name__title" id="officerName">Officer</span>
  <span class="corner-name__meta">On duty</span>
</div>

<section class="sheet-bottom">
  <div class="sheet-handle" aria-hidden="true"></div>
  <div id="banner" class="banner banner--muted">Waiting for location permission…</div>

  <div class="officer-card__rally" id="rallyName">No assignment yet</div>
  <div class="officer-card__notes" id="rallyNotes" hidden></div>

  <div class="officer-card__stats">
    <div>
      <div class="stat__value" id="statDistance">—</div>
      <div class="stat__label">From post</div>
    </div>
    <div>
      <div class="stat__value" id="statRadius">—</div>
      <div class="stat__label">Allowed</div>
    </div>
    <div>
      <div class="stat__value" id="statAccuracy">—</div>
      <div class="stat__label">GPS accuracy</div>
    </div>
  </div>

  <div class="officer-card__footer">
    <span id="lastSent">Not reported yet</span>
    <button type="button" class="btn btn--sm" id="recentre">Centre map</button>
  </div>
</section>

<script type="module" src="/js/pages/officer.js"></script>
</body>
</html>
